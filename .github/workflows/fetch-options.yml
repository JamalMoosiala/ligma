name: Fetch NSE Option Chain to Vault

on:
  schedule:
    # Cron is UTC. IST = UTC+5:30, market hours 09:15-15:30 IST.
    # 09:15 IST = 03:45 UTC, 15:30 IST = 10:00 UTC.
    #
    # CHANGED from every-5-min to every-15-min after observing a large gap
    # between configured and actual trigger frequency: GitHub Actions
    # Performance Metrics showed only 37 job runs in a period where a
    # 5-minute schedule should have produced roughly 1000+. The jobs
    # themselves ran fast and reliably (avg 56s run time, 3% failure rate)
    # -- this isn't the code being slow, it's GitHub's scheduler not
    # firing anywhere near as often as configured. This is a known,
    # documented GitHub Actions limitation: scheduled triggers are
    # best-effort and can be delayed or dropped under load, especially at
    # high density. Testing whether a coarser interval fires more
    # reliably before considering alternatives (e.g. scheduling via the
    # Pi's own cron instead of GitHub's).
    - cron: "45 3 * * 1-5"
    - cron: "0,15,30,45 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
    # Weekday/holiday filtering ALSO happens inside the script itself
    # (holidays.py) as a second line of defense independent of this cron.
  workflow_dispatch: {}   # manual trigger from the Actions tab, for testing

permissions:
  contents: write

concurrency:
  group: fetch-options-vault
  cancel-in-progress: false   # queue, never kill a mid-flight fetch/commit

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch (with retry for transient GitHub/runner hiccups)
        # This retries the WHOLE script up to 2 extra times only if it
        # exits non-zero -- note run_fetch.py itself already retries
        # individual NSE calls internally and exits 0 even on a fully bad
        # cycle, so this outer retry mainly guards against runner-level
        # issues (network blip on the Actions runner itself, etc.).
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: python scripts/run_fetch.py

      - name: Commit and push vault data
        run: |
          git config user.name "options-vault-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vault/
          if git diff --cached --quiet; then
            echo "No changes to commit (non-trading day, or nothing new)."
            exit 0
          fi
          git commit -m "vault: snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # Pull-rebase before push in case another run (or a manual push)
          # landed in between checkout and commit -- avoids a failed push
          # on a race, since multiple cycles a day makes this non-trivial.
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
